<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Appointment | Reshma HomeoCare</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">✚</span><div><strong>Reshma HomeoCare</strong><small>Book consultation</small></div></a><div class="lang-toggle"><button class="lang-btn" onclick="setLanguage('en')">EN</button><button class="lang-btn active" onclick="setLanguage('hinglish')">HI-EN</button><button class="lang-btn" onclick="setLanguage('hi')">हिंदी</button></div></header><main class="page"><div class="page-title"><span class="eyebrow">BOOK CONSULTATION / APPOINTMENT</span><h1>Choose your appointment</h1><p style="color:var(--muted)">10–15 minute online consultation with Dr. Reshma Singh.</p></div><div class="grid-2"><section class="panel"><h2 style="font-size:26px">Select date / Date चुनें</h2><div class="date-row" id="dates"></div><h3>Available slots / Available समय</h3><div class="slot-grid" id="slots"></div><div id="selected" class="notice" style="display:none"></div></section><section class="panel"><h2 style="font-size:26px">Patient details / पेशेंट जानकारी</h2><div class="form-group"><label>Full name / नाम</label><input id="name"></div><div class="form-group"><label>Mobile / मोबाइल</label><input id="phone"></div><div class="form-group"><label>Reason / समस्या</label><textarea id="reason" rows="4" placeholder="Apni problem short mein likhein"></textarea></div><div class="form-group"><label>Payment preference / भुगतान विकल्प</label><select id="payment"><option>Pay before appointment — UPI / QR</option><option>Pay after consultation</option></select></div><button class="btn btn-primary full" onclick="book()">Confirm Appointment / बुक करें</button></section></div></main><script src="../js/app.js"></script><script>let selectedDate='',selectedSlot='';const times=['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM','12:15 PM','12:30 PM','12:45 PM','04:00 PM','04:15 PM','04:30 PM','04:45 PM'];function renderDates(){const box=document.getElementById('dates');for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);const b=document.createElement('button');b.className='date-btn'+(i===0?' active':'');b.innerHTML='<small>'+d.toLocaleDateString('en-IN',{weekday:'short'})+'</small><b>'+d.getDate()+' '+d.toLocaleDateString('en-IN',{month:'short'})+'</b>';b.onclick=()=>{document.querySelectorAll('.date-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedDate=d.toISOString().slice(0,10);renderSlots()};box.appendChild(b);if(i===0)selectedDate=d.toISOString().slice(0,10)}}function renderSlots(){const box=document.getElementById('slots');box.innerHTML='';times.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===2&&selectedDate===new Date().toISOString().slice(0,10)?' booked':'');b.textContent=t;if(!b.classList.contains('booked'))b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedSlot=t;const s=document.getElementById('selected');s.style.display='block';s.textContent='Selected: '+selectedDate+' at '+t};box.appendChild(b)})}function book(){const name=document.getElementById('name').value.trim();if(!name||!selectedSlot)return alert('Name and slot select karein / नाम और स्लॉट चुनें');localStorage.setItem('appointment',JSON.stringify({name,phone:document.getElementById('phone').value,date:selectedDate,time:selectedSlot,reason:document.getElementById('reason').value,payment:document.getElementById('payment').value,status:'Confirmed'}));location.href='confirmation.html'}renderDates();renderSlots();</script></body></html>
